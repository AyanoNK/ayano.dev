name: Weekly rebuild

# Rebuilds the site on Vercel so it picks up changes in the projects' GitHub repos.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Call the Vercel deploy hook
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
